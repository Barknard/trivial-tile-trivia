      /* T-cubed Quit button (injected by inline script below) */
      #tt-quit-btn {
        position: fixed;
        top: 4px;
        right: 4px;
        z-index: 99999;
        padding: 6px 12px;
        background: #dc2626;

        font: 600 12px/1 system-ui, sans-serif;

      }

  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW registration failed:', err));
        });
      }

      // T-cubed Quit button: floats top-right on the host page only.
      // Confirms, then notifies the server to tear down the room, clears
      // local state, and returns the user to the home screen.
      (function installQuitButton(){
        function gameIdFromAppState(){
          try {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              const v = localStorage.getItem(k);
              if (!v) continue;
              let m = v.match(/[A-Z0-9]{4}/);
              if (m && /game|session|room/i.test(k)) return m[0];
            }
            const txt = document.body.textContent || '';
            const m = txt.match(/Session\s*([A-Z0-9]{3,6})/i);
            if (m) return m[1];
          } catch (e) {}
          return null;
        }

        function shouldShow(){
          // Show on /host AND on /board (both are "operator" surfaces). Hide on
          // player views to avoid an inviting red button for guests.
          const p = location.pathname;
          return p === '/host' || p.startsWith('/board');
        }

        function quit(){
          if (!confirm('End this game session?\nAll players will be disconnected.')) return;
          const gameId = gameIdFromAppState();
          const done = () => {
            try { localStorage.clear(); } catch (e) {}
            try { sessionStorage.clear(); } catch (e) {}
            location.href = '/';
          };
          if (gameId) {
            fetch('/api/quit?gameId=' + encodeURIComponent(gameId), { method: 'POST' })
              .catch(() => {}).finally(done);
          } else { done(); }
        }

        function ensureButton(){
          if (!shouldShow()) {
            const old = document.getElementById('tt-quit-btn');
            if (old) old.remove();
            return;
          }
          if (document.getElementById('tt-quit-btn')) return;
          const btn = document.createElement('button');
          btn.id = 'tt-quit-btn';
          btn.type = 'button';
          btn.textContent = 'QUIT';
          btn.title = 'End the game session and return to the home screen.';
          btn.addEventListener('click', quit);
          document.body.appendChild(btn);
        }

        // Run on load and whenever React swaps routes (history API / hash).
        window.addEventListener('load', ensureButton);
        window.addEventListener('popstate', ensureButton);
        const _ps = history.pushState; history.pushState = function(){ const r = _ps.apply(this, arguments); setTimeout(ensureButton, 50); return r; };
        const _rs = history.replaceState; history.replaceState = function(){ const r = _rs.apply(this, arguments); setTimeout(ensureButton, 50); return r; };
        setInterval(ensureButton, 1500); // safety net for SPA navigation
      })();
    </script>
